name: tests

on:
  push:
  pull_request:

# The job only reads the checkout; the default GITHUB_TOKEN scope is wider.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu for the common case; Windows because the PowerShell,
        # console-window and clipboard paths are written for it.
        os: [ubuntu-latest, windows-latest]
        # The oldest Python the pinned dependencies allow, and the one
        # the README names as tested.
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to commit SHAs: a moved tag can't change what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
