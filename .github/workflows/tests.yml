name: tests

on:
  push:
  pull_request:

# The job only reads the checkout; the default GITHUB_TOKEN scope is wider.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu for the common case; Windows because the PowerShell,
        # console-window and clipboard paths are written for it.
        os: [ubuntu-latest, windows-latest]
        # The oldest Python the pinned dependencies allow, and the one
        # the README names as tested.
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to commit SHAs: a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
