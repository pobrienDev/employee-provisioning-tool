# Example configuration — copy to config.yaml and fill in real values.
# config.yaml is git-ignored and never committed.

tenant:
  domain: example.onmicrosoft.com
  usage_location: US   # ISO country code stamped on new accounts (required for licensing)

naming:
  # Role-account prefixes that `discover <property number>` checks, e.g. manager619
  roles: [manager, assistant, leasing, maintenance]

# Accounts at properties display as "{title} at {property name}"; accounts at
# this property (the corporate office) keep a personal "First Last" name.
corporate_property: "50"

# License SKU assigned by new/reuse — find IDs with: python provision.py skus
# Leave blank (or omit) to skip license assignment, e.g. in a dev tenant with no licenses.
license_sku: ""

# Groups every hire joins based on where and what they are, merged with the
# property's own groups below (duplicates collapse):
groups:
  corporate:                                    # property_number == corporate_property
    - "00000000-0000-0000-0000-000000000003"  # Corporate Staff
  site:                                         # every other property
    - "00000000-0000-0000-0000-000000000004"  # Site Staff
  titles:                                       # case-insensitive exact title match
    "Property Manager":
      - "00000000-0000-0000-0000-000000000005"  # Property Managers
    "Maintenance Technician":
      - "00000000-0000-0000-0000-000000000006"  # Maintenance

# Property number -> groups specific to that property
properties:
  "101":
    name: Example Apartments
    groups:
      - "00000000-0000-0000-0000-000000000001"  # All Staff
      - "00000000-0000-0000-0000-000000000002"  # Property 101 distribution list
