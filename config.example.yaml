# Example configuration — copy to config.yaml and fill in real values.
# config.yaml is git-ignored and never committed.

tenant:
  domain: example.onmicrosoft.com
  usage_location: US   # ISO country code stamped on new accounts (required for licensing)

naming:
  # Role-account prefixes that `discover <property number>` checks, e.g. manager619
  roles: [manager, assistant, leasing, maintenance]

# License SKU assigned by new/reuse — find IDs with: python provision.py skus
# Leave blank (or omit) to skip license assignment, e.g. in a dev tenant with no licenses.
license_sku: ""

# Property number -> groups the provisioned account joins
properties:
  "101":
    name: Example Apartments
    groups:
      - "00000000-0000-0000-0000-000000000001"  # All Staff
      - "00000000-0000-0000-0000-000000000002"  # Property 101 distribution list
